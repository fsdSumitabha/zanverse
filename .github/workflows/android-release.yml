# Builds the signed, minified release bundle and sends it to the Play internal testing track.
#
# Runs on a pushed tag such as v0.1.0 (build and upload) and by hand from the Actions tab (build only).
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64      the upload keystore, base64-encoded
#   MYAPP_UPLOAD_KEY_ALIAS       its alias
#   MYAPP_UPLOAD_STORE_PASSWORD  its store password
#   MYAPP_UPLOAD_KEY_PASSWORD    its key password
#   PLAY_SERVICE_ACCOUNT_JSON    a Play Console service account with "Release to testing tracks"
#   SENTRY_AUTH_TOKEN            optional; with it, sentry.gradle uploads the source maps
name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # versionCode in android/app/build.gradle; versionName comes from package.json.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npx jest --ci

      - name: Decode the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; the bundle would be debug-signed and Play would reject it." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload.keystore

      - name: Build the release bundle
        working-directory: android
        env:
          # Relative to android/app, where build.gradle resolves it.
          MYAPP_UPLOAD_STORE_FILE: upload.keystore
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Remove the keystore
        if: always()
        run: rm -f android/app/upload.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload to the Play internal track
        if: startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.zanverse
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: completed
